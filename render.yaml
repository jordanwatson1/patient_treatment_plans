databases:
  - name: patient_treatment_plans_db
    databaseName: patient_treatment_plans
    user: patient_treatment_plans
    plan: free

services:
  - type: web
    name: patient_treatment_plans
    runtime: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rails server"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: patient_treatment_plans_db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: "1"
      - key: NODE_VERSION
        value: "20"
      - key: RAILS_ENV
        value: "production"
      - key: RACK_ENV
        value: "production"